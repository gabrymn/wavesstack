version: "3"
services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome-app
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: "info"
    volumes:
      - ./data:/data
      - ./../music-library:/music:ro
    restart: unless-stopped
